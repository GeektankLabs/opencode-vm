services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: ocvm-searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng_net
    volumes:
      - valkey_data:/data

  searxng:
    image: searxng/searxng:latest
    container_name: ocvm-searxng
    restart: unless-stopped
    depends_on:
      - valkey
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - searxng_net
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4

networks:
  searxng_net:
    driver: bridge

volumes:
  valkey_data:
