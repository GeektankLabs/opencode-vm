# SearXNG rate-limiter config. Required when server.limiter: true is set in
# settings.yml. The limiter uses Valkey/Redis as backend (configured in
# settings.yml under redis.url). These defaults are deliberately permissive
# because this SearXNG instance is private to opencode-vm and not exposed
# to the public internet.

[real_ip]
# Trust X-Forwarded-For from Docker network; we don't proxy through anything
# external. ipv4_prefix/ipv6_prefix control how much of the IP is used as
# the rate-limit key (32/64 = full address, no aggregation).
x_for = 1
ipv4_prefix = 32
ipv6_prefix = 64

[botdetection.ip_limit]
# Generous limits — single LLM agent making bursty searches should never trip.
filter_link_local = false
link_token = false

[botdetection.ip_lists]
# No allow/block lists; private deployment.
pass_searxng_org = false
