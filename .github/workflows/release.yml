name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - opencode-vm.sh
      - adapters/openlive-acp/**
      - adapters/mcp/**
      - runtime/**
      - scripts/build-openlive-adapter.sh
      - scripts/build-mcp-adapter.sh
      - scripts/build-agent-hub.sh
      - hub/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      openlive_asset: ${{ steps.metadata.outputs.openlive_asset }}
      mcp_asset: ${{ steps.metadata.outputs.mcp_asset }}
      hub_asset: ${{ steps.metadata.outputs.hub_asset }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve release metadata
        id: metadata
        run: |
          assert_equal() {
            if [[ "$2" != "$3" ]]; then
              echo "::error::$1: expected '$3', got '$2'." >&2
              exit 1
            fi
          }
          script_version="$(awk -F'\"' '/^OCVM_VERSION=/ {print $2; exit}' opencode-vm.sh)"
          adapter_version="$(awk -F'\"' '/^OPENLIVE_ADAPTER_VERSION=/ {print $2; exit}' opencode-vm.sh)"
          adapter_tag="$(awk -F'\"' '/^OPENLIVE_ADAPTER_TAG=/ {print $2; exit}' opencode-vm.sh)"
          openlive_asset="$(awk -F'\"' '/^OPENLIVE_ADAPTER_FILENAME=/ {print $2; exit}' opencode-vm.sh)"
          mcp_version="$(awk -F'\"' '/^MCP_ADAPTER_VERSION=/ {print $2; exit}' opencode-vm.sh)"
          mcp_tag="$(awk -F'\"' '/^MCP_ADAPTER_TAG=/ {print $2; exit}' opencode-vm.sh)"
          mcp_asset="$(awk -F'\"' '/^MCP_ADAPTER_FILENAME=/ {print $2; exit}' opencode-vm.sh)"
          hub_tag="$(awk -F'\"' '/^HUB_ASSET_TAG=/ {print $2; exit}' opencode-vm.sh)"
          hub_asset="$(awk -F'\"' '/^HUB_ASSET_FILENAME=/ {print $2; exit}' opencode-vm.sh)"
          release_tag="v$script_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            assert_equal "Pushed tag must match OCVM_VERSION" "$GITHUB_REF_NAME" "$release_tag"
          fi
          assert_equal "OPENLIVE_ADAPTER_TAG must match OCVM_VERSION" "$adapter_tag" "$release_tag"
          assert_equal "OPENLIVE_ADAPTER_VERSION must match package.json" "$adapter_version" "$(jq -r '.version' adapters/openlive-acp/package.json)"
          assert_equal "OPENLIVE_ADAPTER_FILENAME" "$openlive_asset" "opencode-vm-openlive-adapter-$adapter_version.tar"
          if ! grep -qF "const ADAPTER_VERSION = \"$adapter_version\";" adapters/openlive-acp/src/acp/transport.ts; then
            echo "::error::transport.ts ADAPTER_VERSION must match OPENLIVE_ADAPTER_VERSION '$adapter_version'." >&2
            exit 1
          fi
          assert_equal "MCP_ADAPTER_TAG must match OCVM_VERSION" "$mcp_tag" "$release_tag"
          assert_equal "HUB_ASSET_TAG must match OCVM_VERSION" "$hub_tag" "$release_tag"
          assert_equal "HUB_ASSET_FILENAME" "$hub_asset" "opencode-vm-hub-1.tar"
          assert_equal "MCP_ADAPTER_VERSION must match package.json" "$mcp_version" "$(jq -r '.version' adapters/mcp/package.json)"
          assert_equal "MCP_ADAPTER_FILENAME" "$mcp_asset" "opencode-vm-mcp-adapter-$mcp_version.tar"
          if ! grep -qF "export const ADAPTER_VERSION = \"$mcp_version\";" adapters/mcp/src/types.ts; then
            echo "::error::types.ts ADAPTER_VERSION must match MCP_ADAPTER_VERSION '$mcp_version'." >&2
            exit 1
          fi
          assert_equal "MCP_SDK_VERSION" "$(awk -F'\"' '/^MCP_SDK_VERSION=/ {print $2; exit}' opencode-vm.sh)" "$(jq -r '.dependencies["@modelcontextprotocol/sdk"]' adapters/mcp/package.json)"
          assert_equal "MCP_OPENCODE_SDK_VERSION" "$(awk -F'\"' '/^MCP_OPENCODE_SDK_VERSION=/ {print $2; exit}' opencode-vm.sh)" "$(jq -r '.dependencies["@opencode-ai/sdk"]' adapters/mcp/package.json)"
          printf 'openlive_asset=%s\nmcp_asset=%s\nhub_asset=%s\nrelease_tag=%s\n' "$openlive_asset" "$mcp_asset" "$hub_asset" "$release_tag" >> "$GITHUB_OUTPUT"

  release:
    needs: [metadata]
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-vm-release-${{ needs.metadata.outputs.release_tag }}
      cancel-in-progress: false
    env:
      OPENLIVE_ASSET: ${{ needs.metadata.outputs.openlive_asset }}
      MCP_ASSET: ${{ needs.metadata.outputs.mcp_asset }}
      HUB_ASSET: ${{ needs.metadata.outputs.hub_asset }}
      OPENLIVE_RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release state
        id: state
        run: |
          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          error_file="$state_dir/api-error"
          if release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$OPENLIVE_RELEASE_TAG" 2>"$error_file")"; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$OPENLIVE_RELEASE_TAG" --jq .sha)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              changed_files="$(gh api \
                "repos/$GITHUB_REPOSITORY/compare/$OPENLIVE_RELEASE_TAG...$GITHUB_SHA" \
                --paginate --jq '.files[].filename')"
              if grep -Eq '^(opencode-vm\.sh|scripts/build-(openlive|mcp)-adapter\.sh|scripts/build-agent-hub\.sh|hub/|runtime/|adapters/(openlive-acp|mcp)/)' \
                <<<"$changed_files"; then
                echo "Release inputs changed without incrementing OCVM_VERSION." >&2
                exit 1
              fi
            fi
            if ! jq -e --arg script "opencode-vm.sh" --arg openlive "$OPENLIVE_ASSET" --arg mcp "$MCP_ASSET" --arg hub "$HUB_ASSET" '
              .draft == false and .prerelease == false and
              ([.assets[].name] | index($script) != null and
               index($openlive) != null and index($mcp) != null and index($hub) != null and index("SHA256SUMS") != null)
              ' <<<"$release" >/dev/null; then
              echo "Release $OPENLIVE_RELEASE_TAG exists but is incomplete or inconsistent." >&2
              exit 1
            fi
            mkdir "$state_dir/assets"
            gh release download "$OPENLIVE_RELEASE_TAG" --dir "$state_dir/assets" \
              --pattern opencode-vm.sh --pattern "$OPENLIVE_ASSET" --pattern "$MCP_ASSET" --pattern "$HUB_ASSET" --pattern SHA256SUMS
            gh api --method GET "repos/$GITHUB_REPOSITORY/contents/opencode-vm.sh" \
              -f ref="$OPENLIVE_RELEASE_TAG" --jq .content | base64 --decode > "$state_dir/tag-opencode-vm.sh"
            expected_sha="$(awk -F'\"' '/^OPENLIVE_ADAPTER_SHA256=/ {print $2; exit}' opencode-vm.sh)"
            expected_mcp_sha="$(awk -F'\"' '/^MCP_ADAPTER_SHA256=/ {print $2; exit}' opencode-vm.sh)"
            expected_hub_sha="$(awk -F'\"' '/^HUB_ASSET_SHA256=/ {print $2; exit}' opencode-vm.sh)"
            if ! cmp "$state_dir/assets/opencode-vm.sh" "$state_dir/tag-opencode-vm.sh" ||
              ! cmp "$state_dir/assets/opencode-vm.sh" opencode-vm.sh ||
              ! grep -qxF "$expected_sha  $OPENLIVE_ASSET" "$state_dir/assets/SHA256SUMS" ||
              ! grep -qxF "$expected_mcp_sha  $MCP_ASSET" "$state_dir/assets/SHA256SUMS" ||
              ! grep -qxF "$expected_hub_sha  $HUB_ASSET" "$state_dir/assets/SHA256SUMS" ||
              ! (cd "$state_dir/assets" && sha256sum -c SHA256SUMS); then
              echo "Release $OPENLIVE_RELEASE_TAG exists but its tag or assets are inconsistent." >&2
              exit 1
            fi
            printf 'release_needed=false\n' >> "$GITHUB_OUTPUT"
            echo "Release $OPENLIVE_RELEASE_TAG already exists and is complete."
          elif grep -q '(HTTP 404)' "$error_file"; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$OPENLIVE_RELEASE_TAG" >/dev/null 2>"$error_file"; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$OPENLIVE_RELEASE_TAG" --jq .sha)"
              if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
                echo "Tag $OPENLIVE_RELEASE_TAG points to $tag_sha, expected $GITHUB_SHA." >&2
                exit 1
              fi
            elif ! grep -q '(HTTP 404)' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            printf 'release_needed=true\n' >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.state.outputs.release_needed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            adapters/openlive-acp/package-lock.json
            adapters/mcp/package-lock.json
      - name: Install OpenLive adapter dependencies
        if: steps.state.outputs.release_needed == 'true'
        working-directory: adapters/openlive-acp
        run: npm ci --ignore-scripts
      - name: Install MCP adapter dependencies
        if: steps.state.outputs.release_needed == 'true'
        working-directory: adapters/mcp
        run: npm ci --ignore-scripts
      - name: Compile-check published script and build scripts
        if: steps.state.outputs.release_needed == 'true'
        run: bash -n opencode-vm.sh scripts/build-openlive-adapter.sh scripts/build-mcp-adapter.sh scripts/build-agent-hub.sh
      - name: Build reproducible adapters
        if: steps.state.outputs.release_needed == 'true'
        run: |
          mkdir -p release-a release-b
          scripts/build-openlive-adapter.sh "release-a/$OPENLIVE_ASSET"
          scripts/build-openlive-adapter.sh "release-b/$OPENLIVE_ASSET"
          scripts/build-mcp-adapter.sh "release-a/$MCP_ASSET"
          scripts/build-mcp-adapter.sh "release-b/$MCP_ASSET"
          scripts/build-agent-hub.sh "release-a/$HUB_ASSET"
          scripts/build-agent-hub.sh "release-b/$HUB_ASSET"
          cmp "release-a/$OPENLIVE_ASSET" "release-b/$OPENLIVE_ASSET"
          cmp "release-a/$MCP_ASSET" "release-b/$MCP_ASSET"
          cmp "release-a/$HUB_ASSET" "release-b/$HUB_ASSET"
          actual="$(sha256sum "release-a/$OPENLIVE_ASSET" | awk '{print $1}')"
          expected="$(awk -F'\"' '/^OPENLIVE_ADAPTER_SHA256=/ {print $2; exit}' opencode-vm.sh)"
          mcp_actual="$(sha256sum "release-a/$MCP_ASSET" | awk '{print $1}')"
          mcp_expected="$(awk -F'\"' '/^MCP_ADAPTER_SHA256=/ {print $2; exit}' opencode-vm.sh)"
          hub_actual="$(sha256sum "release-a/$HUB_ASSET" | awk '{print $1}')"
          hub_expected="$(awk -F'\"' '/^HUB_ASSET_SHA256=/ {print $2; exit}' opencode-vm.sh)"
          test "$actual" = "$expected"
          test "$mcp_actual" = "$mcp_expected"
          test "$hub_actual" = "$hub_expected"
          printf '%s  %s\n%s  %s\n%s  %s\n' "$actual" "$OPENLIVE_ASSET" "$mcp_actual" "$MCP_ASSET" "$hub_actual" "$HUB_ASSET" > release-a/SHA256SUMS
          mkdir release-smoke
          tar -xf "release-a/$OPENLIVE_ASSET" -C release-smoke
          root="release-smoke/${OPENLIVE_ASSET%.tar}"
          test -f "$root/dist/main.js"
          test -f "$root/dist/remote/client.js"
          test -f "$root/dist/remote/server.js"
          test -f "$root/manager/tool.mjs"
          test ! -e "$root/src"
          test ! -e "$root/tests"
          test ! -e "$root/node_modules"
          mkdir release-mcp-smoke
          tar -xf "release-a/$MCP_ASSET" -C release-mcp-smoke
          mcp_root="release-mcp-smoke/${MCP_ASSET%.tar}"
          test -f "$mcp_root/dist/main.js"
          test -f "$mcp_root/manifest.json"
          test ! -e "$mcp_root/src"
          test ! -e "$mcp_root/tests"
          test ! -e "$mcp_root/node_modules"
          mkdir release-hub-smoke
          tar -xf "release-a/$HUB_ASSET" -C release-hub-smoke
          test -f release-hub-smoke/hub/server.py
          test -f release-hub-smoke/hub/policy.py
          test -f release-hub-smoke/hub/catalog.py
          test -f release-hub-smoke/hub/control.js
          test ! -e release-hub-smoke/hub/__pycache__
      - name: Publish release
        if: steps.state.outputs.release_needed == 'true'
        run: |
          error_file="$(mktemp)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$OPENLIVE_RELEASE_TAG" >/dev/null 2>"$error_file"; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$OPENLIVE_RELEASE_TAG" --jq .sha)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $OPENLIVE_RELEASE_TAG points to $tag_sha, expected $GITHUB_SHA." >&2
              exit 1
            fi
          elif grep -q '(HTTP 404)' "$error_file"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$OPENLIVE_RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          else
            cat "$error_file" >&2
            exit 1
          fi
          rm -f "$error_file"
          gh release create "$OPENLIVE_RELEASE_TAG" \
            opencode-vm.sh \
            "release-a/$OPENLIVE_ASSET" \
            "release-a/$MCP_ASSET" \
            "release-a/$HUB_ASSET" \
            release-a/SHA256SUMS \
            --verify-tag --generate-notes --title "opencode-vm $OPENLIVE_RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
